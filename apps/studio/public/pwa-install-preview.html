<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loftlancer dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --sidebar: #fafafa;
        --border: #e5e5e5;
        --muted: #737373;
        --text: #171717;
        --primary: #262626;
        --primary-fg: #f5f5f5;
        --card: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.4;
        color: var(--text);
        background: var(--bg);
      }
      .shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        background: var(--sidebar);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg {
        width: 16px;
        height: 16px;
      }
      .nav-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 8px 8px 4px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--text);
      }
      .nav-item.active {
        background: #f0f0f0;
        font-weight: 500;
      }
      .nav-item svg {
        width: 16px;
        height: 16px;
        color: var(--muted);
        flex-shrink: 0;
      }
      main {
        flex: 1;
        padding: 24px;
        min-width: 0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
      }
      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 16px;
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }
      .card p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        .sidebar {
          width: 72px;
        }
        .brand span,
        .nav-item span,
        .nav-label {
          display: none;
        }
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Sidebar">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"
              />
              <path
                d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"
              />
              <path
                d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"
              />
            </svg>
          </span>
          <span>Loftlancer</span>
        </div>
        <div class="nav-label">Platform</div>
        <div class="nav-item active">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <path d="M16 3.128a4 4 0 0 1 0 7.744" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
            <circle cx="9" cy="7" r="4" />
          </svg>
          <span>Organizations</span>
        </div>
        <div class="nav-item">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
            />
          </svg>
          <span>Projects</span>
        </div>
        <div class="nav-label">Projects</div>
        <div class="nav-item">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h2.172a2 2 0 0 0 1.414-.586l.9-.9a2 2 0 0 0 0-2.828l-1.172-1.172a2 2 0 0 0-2.828 0l-.879.879z"
            />
            <path
              d="M8.5 10.5 10 12l4-4 3 3 2.5-2.5a2.121 2.121 0 0 1 3 3L15 17l-4 4-6.5-6.5a2.121 2.121 0 0 1 0-3z"
            />
          </svg>
          <span>Demo project</span>
        </div>
      </aside>
      <main>
        <h1>Organizations</h1>
        <p class="subtitle">Manage workspaces and members in Loftlancer.</p>
        <div class="grid">
          <article class="card">
            <h2>Acme Corp</h2>
            <p>3 projects · 9 environments</p>
          </article>
          <article class="card">
            <h2>Demo workspace</h2>
            <p>1 project · 3 environments</p>
          </article>
        </div>
      </main>
    </div>
  </body>
</html>
